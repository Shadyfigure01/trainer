<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AAS Exam Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Saira+Condensed:wght@700;800&display=swap">
<style>
:root{--bg:#EDF0F5;--surface:#fff;--ink:#0B1729;--muted:#56637B;--line:#D3DAE6;--accent:#1D3BB8;--accent-ink:#fff;--bad:#C8102E;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#070E1B;--surface:#0E1A2D;--ink:#E5EBF5;--muted:#8D9BB4;--line:#22334F;--accent:#7D9BFF;--accent-ink:#06102A;--bad:#FF5266;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center}
.box svg{width:64px;height:64px}
h1{font:800 1.6rem/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:12px 0 4px}
p{margin:0 0 20px;color:var(--muted);font-size:.95rem}
form{display:flex;flex-direction:column;gap:10px}
input{font:600 1.3rem var(--f-mono);letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:3px solid var(--accent);outline-offset:1px}
button{font:800 1.05rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-weight:600;font-size:.9rem;min-height:1.4em;margin:2px 0 0}
a{color:var(--accent);font-size:.88rem;display:inline-block;margin-top:16px}
.shake{animation:sh .35s}@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion: reduce){.shake{animation:none}}
</style></head><body>

  <h1>AAS Exam Trainer</h1>
  <p>Enter the passcode from your Candidate Training Officer.</p>
  <form id="f" autocomplete="off">

    <button id="go" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>

</div>

const KEY = "aas26.unlock";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pass){
  const raw = b64(BLOB), salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data));
}
function open(html){ document.open(); document.write(html); document.close(); }
async function tryPass(pass, quiet){
  try{ const html = await decrypt(pass.trim().toUpperCase()); try{ localStorage.setItem(KEY, pass.trim().toUpperCase()); }catch(e){} open(html); return true; }
  catch(e){ if(!quiet){ const b=document.getElementById("box"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); document.getElementById("err").textContent="That passcode isn't right."; } return false; }
}
(async () => {
  let saved = null; try{ saved = localStorage.getItem(KEY); }catch(e){}
  if(saved && await tryPass(saved, true)) return;
  document.getElementById("code").focus();
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); const btn=document.getElementById("go"); btn.disabled=true; btn.textContent="Checking…";
  const ok = await tryPass(document.getElementById("code").value, false);
  if(!ok){ btn.disabled=false; btn.textContent="Unlock"; }
});
</script>
